# À placer dans /usr/local/nagios/etc/objects/sila.cfg puis ajouter :
#   cfg_file=/usr/local/nagios/etc/objects/sila.cfg   dans nagios.cfg
define host {
    use                 linux-server
    host_name           sila-host
    alias               SILA (Docker Desktop)
    address             host.docker.internal   ; adapter selon votre installation
    max_check_attempts  3
}
define service {
    use                 generic-service
    host_name           sila-host
    service_description Frontend HTTP
    check_command       check_http!-p 3000 -u /
}
define service {
    use                 generic-service
    host_name           sila-host
    service_description Backend API health
    check_command       check_http!-p 8000 -u /api/health -s "\"status\":\"ok\""
}
define service {
    use                 generic-service
    host_name           sila-host
    service_description MongoDB port
    check_command       check_tcp!27017
}
