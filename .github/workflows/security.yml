name: Security
on: [push, pull_request]
permissions: { contents: read }
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error --exclude SECURITY_LAB --exclude backend/app/lab.py backend frontend
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - run: cd frontend && npm audit --audit-level=high
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sila-backend ./backend && docker build -t sila-frontend ./frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: sila-backend, severity: "HIGH,CRITICAL", exit-code: "0" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: sila-frontend, severity: "HIGH,CRITICAL", exit-code: "0" }
